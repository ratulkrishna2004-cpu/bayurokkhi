<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAYUROKKHI | Air Guardian</title>
<!--

  To go live, replace the functions in the "DATA LAYER" section with calls to your server API
  (FastAPI + database). Passwords must then be hashed on the server; the demo keeps them readable
  only because the brief asks admins to see member passwords.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF3EF;--card:#FFFFFF;--ink:#14302A;--muted:#566B63;--line:#D3DED8;--soft:#F5F8F6;
  --teal:#0B4F47;--teal2:#0E3F38;--dark:#0E2A25;--gold:#C9971C;--goldt:#8A6212;
  --good:#1E9E6A;--mod:#C9A20C;--usg:#E08A1E;--bad:#D64541;--vbad:#8A5CC2;--haz:#7A1F2B;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;margin:0;line-height:1.15;color:var(--ink)}
a{color:var(--teal)}
button{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--dark);color:#CFE1DA;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:22px 20px 14px;border-bottom:1px solid #1E3F37}
.brand img{display:block;height:76px;width:auto;max-width:100%;object-fit:contain;margin-bottom:10px}
.brand b{display:block;font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:28px;color:#F4F7F5;letter-spacing:.5px}
.brand small{color:var(--gold);font-size:13px}
.navgrp{padding:10px 0 4px}
.navgrp p{margin:6px 20px 4px;font-size:12px;color:#7FA69A}
.nav{display:flex;align-items:center;gap:11px;padding:9px 20px;color:#CFE1DA;cursor:pointer;border-left:4px solid transparent;font-size:14.5px;background:none;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.nav i{width:18px;text-align:center;color:#8FB8AC}
.nav:hover{background:#133A33}
.nav.on{background:var(--teal);color:#fff;border-left-color:var(--gold)}
.nav.on i{color:var(--gold)}
.nav .cnt{margin-left:auto;background:var(--gold);color:var(--dark);font-size:11px;font-weight:700;border-radius:9px;padding:0 7px}
.sidefoot{margin-top:auto;padding:14px 20px;border-top:1px solid #1E3F37;font-size:13px}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--dark);display:flex;align-items:center;justify-content:center;font-weight:700}
/* main */
.main{min-width:0}
.top{position:relative;z-index:500;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:18px 28px;overflow:hidden;
  background:radial-gradient(ellipse 60% 120% at 50% 55%,#23A67F 0%,#128466 30%,#0B5A4F 62%,#0B4F47 100%);border-bottom:3px solid var(--gold)}
.toplogo{grid-column:2;display:flex;align-items:center;justify-content:center;text-decoration:none}
.neo{display:block;height:150px;width:auto;max-width:60vw;object-fit:contain;transition:transform .25s;
  animation:neoGlow 3.2s ease-in-out infinite alternate}
.toplogo:hover .neo{transform:scale(1.04)}
.neo-text{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:64px;letter-spacing:4px;color:#EFFFF8;
  animation:neoText 3.2s ease-in-out infinite alternate}
@keyframes neoGlow{from{filter:drop-shadow(0 0 4px rgba(255,255,255,.55)) drop-shadow(0 0 12px rgba(124,252,176,.75)) drop-shadow(0 0 26px rgba(201,151,28,.45))}
  to{filter:drop-shadow(0 0 7px rgba(255,255,255,.8)) drop-shadow(0 0 22px rgba(124,252,176,1)) drop-shadow(0 0 48px rgba(242,201,76,.75))}}
@keyframes neoText{from{text-shadow:0 0 6px rgba(80,240,180,.6),0 0 18px rgba(201,151,28,.35)}to{text-shadow:0 0 12px rgba(80,240,180,1),0 0 34px rgba(201,151,28,.65)}}
.top .right{grid-column:3;justify-self:end;display:flex;gap:8px;align-items:center}
.burger{grid-column:1;justify-self:start;display:none;background:none;border:0;font-size:24px;color:#EFFFF8;cursor:pointer}
.phead{margin-bottom:18px}
.phead h1{font-size:30px}
.phead .sub{color:var(--muted);font-size:14.5px}
.content{padding:24px 28px 60px;max-width:1400px}
/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.card h3 .hint{font-family:"Barlow";font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:30px;color:var(--teal);line-height:1.1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{background:var(--teal2)}
.btn.o{background:transparent;color:var(--teal);border-color:var(--teal)}.btn.o:hover{background:#E1F0EB}
.btn.g{background:var(--gold);color:var(--dark)}.btn.g:hover{background:#B8871A}
.btn.r{background:#FBEAE9;color:var(--bad);border-color:#F1B9B5}.btn.r:hover{background:#F6D5D3}
.btn.s{padding:5px 10px;font-size:13px}
.btn.l{background:transparent;color:var(--muted);padding:5px 8px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:10px;border:1px solid;white-space:nowrap}
.t-ok{background:#DDF3E6;color:#1B7A4B;border-color:#8FD1AE}.t-warn{background:#FCF1E2;color:#9A5B0C;border-color:#EBC08A}.t-bad{background:#FBEAE9;color:#A82F2B;border-color:#F1B9B5}.t-info{background:#E3EEFB;color:#1F5FA0;border-color:#9DC0E6}.t-gray{background:#F1F3F2;color:#56645F;border-color:#C5CFCB}.t-gold{background:#F6ECD6;color:#7A520C;border-color:#DDBD73}.t-pur{background:#EEE7F8;color:#5E3F95;border-color:#C3AEE3}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #E6EDE9;vertical-align:top}
.tbl tr:hover td{background:#FAFCFB}
.twrap{overflow-x:auto}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
.in:focus{outline:2px solid #9BCBBE;border-color:var(--teal)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--soft);border-radius:10px;border:1px dashed var(--line)}
.map{height:360px;border-radius:10px;border:1px solid var(--line);z-index:1}
.map.tall{height:470px}.map.short{height:260px}
.chartbox{position:relative;height:250px}.chartbox.sm{height:190px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:16px}
.banner.warn{background:#FCF1E2;border:1px solid #EBC08A;color:#7A4A07}
.banner.bad{background:#FBEAE9;border:1px solid #F1B9B5;color:#8E2622}
.banner.info{background:#E1F0EB;border:1px solid #A9D2C4;color:#0B4F47}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:14px 0 16px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--gold)}
/* hero: the city air ribbon */
.hero{background:var(--dark);color:#F4F7F5;border-radius:16px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;margin-bottom:18px}
.hero .big{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:112px;line-height:.9}
.hero .cat{font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-size:26px;font-weight:600}
.hero p{margin:6px 0 0;color:#BFD6CE;max-width:60ch}
.ribbon{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,#1E9E6A 0%,#1E9E6A 10%,#C9A20C 10%,#C9A20C 20%,#E08A1E 20%,#E08A1E 30%,#D64541 30%,#D64541 40%,#8A5CC2 40%,#8A5CC2 60%,#7A1F2B 60%,#7A1F2B 100%);margin:18px 0 6px}
.ribbon .pin{position:absolute;top:-9px;width:4px;height:36px;background:#fff;border-radius:2px;box-shadow:0 0 0 3px var(--dark)}
.ribbon-l{position:relative;height:16px;font-size:12px;color:#9FBDB3}.ribbon-l span{position:absolute;transform:translateX(-50%)}.ribbon-l span:first-child{transform:none}.ribbon-l span:last-child{transform:translateX(-100%)}
.advice{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.advice span{background:#16453D;border:1px solid #2C6B60;border-radius:20px;padding:5px 12px;font-size:13.5px}
/* node cards */
.ncard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ncard:hover{border-color:var(--teal)}
.ncard .id{font-size:12.5px;color:var(--muted)}
.ncard h4{font-size:19px}
.aqib{display:inline-flex;align-items:baseline;gap:6px;font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;color:#fff;border-radius:8px;padding:2px 10px;font-size:20px}
.aqib small{font-family:"Barlow";font-weight:500;font-size:12px}
/* gauges */
.gauges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:120px}
.gauge b{display:block;font-size:13px;color:var(--muted);margin-top:2px}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(14,42,37,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:22px}
.modal h3{font-size:22px;margin-bottom:6px}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:3000}
.toast{background:var(--dark);color:#F4F7F5;border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;max-width:360px;font-size:14px;box-shadow:0 6px 20px rgba(14,42,37,.25)}
.toast.bad{border-left-color:var(--bad)}
/* cctv sim */
.cctv{position:relative;background:#1B2A27;border-radius:10px;overflow:hidden}
.cctv canvas{width:100%;display:block}
.cctv .lbl{position:absolute;left:10px;top:8px;color:#fff;font-size:12px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px}
.cctv .rec{position:absolute;right:10px;top:8px;color:#ff6b6b;font-size:12px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px}
.sig{display:flex;align-items:center;gap:10px}
.lamp{width:14px;height:14px;border-radius:50%;background:#3a4a46}
.lamp.red{background:#E24B4A;box-shadow:0 0 8px #E24B4A}.lamp.on{background:#F2C94C;box-shadow:0 0 10px #F2C94C}
.route{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.srch{position:relative}.sugg{position:absolute;left:0;right:0;top:100%;z-index:900;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(14,42,37,.15);overflow:hidden}.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:8px 11px;border:0;border-top:1px solid #EEF2F0;background:#fff;cursor:pointer}.sugg button:hover{background:#EEF6F3}.sugg button span{display:block;font-size:12px;color:var(--muted)}
.step{display:flex;gap:12px;align-items:center;padding:9px 6px;border-top:1px solid #E6EDE9}.step.now{background:#E9F4F0;border-radius:8px}
.ico{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}.ico.big{width:48px;height:48px;font-size:26px}
.lg{display:inline-block;width:18px;height:6px;border-radius:3px;margin:0 4px 0 10px}.lg.ring{height:12px;width:12px;border:2px dashed #D64541;border-radius:50%;background:transparent}
.maplg{background:rgba(255,255,255,.94);border-radius:8px;padding:6px 9px;font:12px Barlow,sans-serif;color:#14302A;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.maplg span{display:flex;align-items:center;gap:6px}.maplg i{display:inline-block;width:12px;height:12px;box-sizing:border-box}
.route.sel{border-color:var(--teal);background:#E9F4F0}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #E6EDE9;font-size:14px}
.list-item:first-child{border-top:0}
.pwd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.chk label{display:flex;gap:6px;align-items:center;font-size:14px}
.note{font-size:13px;color:var(--muted)}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.gauges{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-280px;width:270px;z-index:1500;transition:left .2s}
  .side.open{left:0}
  .burger{display:inline-block}
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}
  .hero{grid-template-columns:1fr;gap:10px}.hero .big{font-size:84px}
  .content{padding:18px 14px 50px}.top{padding:12px 14px}.neo{height:96px}.neo-text{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <div class="main">

      <button class="burger" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu">&#9776;</button>
      <a class="toplogo" href="#" onclick="go(home());return false" aria-label="BAYUROKKHI home">

</div>

const BP={pm25:[[0,9,0,50],[9.1,35.4,51,100],[35.5,55.4,101,150],[55.5,125.4,151,200],[125.5,225.4,201,300],[225.5,325.4,301,500]],
pm10:[[0,54,0,50],[55,154,51,100],[155,254,101,150],[255,354,151,200],[355,424,201,300],[425,604,301,500]],
no2:[[0,53,0,50],[54,100,51,100],[101,360,101,150],[361,649,151,200],[650,1249,201,300],[1250,2049,301,500]],
co:[[0,4.4,0,50],[4.5,9.4,51,100],[9.5,12.4,101,150],[12.5,15.4,151,200],[15.5,30.4,201,300],[30.5,50.4,301,500]],
o3:[[0,54,0,50],[55,70,51,100],[71,85,101,150],[86,105,151,200],[106,200,201,300]]};
function sub(p,c){const t=BP[p];for(const [cl,ch,il,ih] of t){if(c<=ch)return Math.round((ih-il)/(ch-cl)*(Math.max(c,cl)-cl)+il)}return 500}
function aqiOf(r){const s={pm25:sub('pm25',r.pm25),pm10:sub('pm10',r.pm10),no2:sub('no2',r.no2),co:sub('co',r.co),o3:sub('o3',r.o3)};let dom='pm25';for(const k in s)if(s[k]>s[dom])dom=k;return {aqi:s[dom],dom,s}}
const CAT=[[50,'Good','var(--good)','#1E9E6A'],[100,'Moderate','var(--mod)','#C9A20C'],[150,'Unhealthy for sensitive groups','var(--usg)','#E08A1E'],[200,'Unhealthy','var(--bad)','#D64541'],[300,'Very unhealthy','var(--vbad)','#8A5CC2'],[999,'Hazardous','var(--haz)','#7A1F2B']];
function cat(a){return CAT.find(c=>a<=c[0])}
const PN={pm25:'PM2.5',pm10:'PM10',no2:'NO2',co:'CO',o3:'O3'};
function advice(a){if(a<=50)return['Air is good','Normal outdoor activity'];if(a<=100)return['Sensitive people: take it easy outdoors','Keep windows open only in the morning'];if(a<=150)return['Wear a mask outside','Children and elderly limit outdoor time','Close windows during rush hour'];return['Wear an N95 mask outdoors','Close windows','Use an air purifier indoors','Avoid heavy outdoor exercise']}
function nodeAqi(n){return aqiOf(n.r).aqi}
function hav(a,b,c,d){const R=6371,t=x=>x*Math.PI/180;const dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function aqiAt(lat,lng){let sw=0,sv=0;for(const n of S.nodes){const d=Math.max(hav(lat,lng,n.lat,n.lng),.05);const w=1/(d*d);sw+=w;sv+=w*nodeAqi(n)}return Math.round(sv/sw)}
function cityAqi(){return Math.round(S.nodes.reduce((s,n)=>s+nodeAqi(n),0)/S.nodes.length)}
function nodeById(id){return S.nodes.find(n=>n.id===id)}
function userById(id){return S.users.find(u=>u.id===id)}
function openTicket(n){return S.tickets.some(t=>t.nodeId===n.id&&t.status==='open')}
function hashN(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function aqiBadge(a){const c=cat(a);return `<span class="aqib" style="background:${c[3]}">${a}<small>${c[1]}</small></span>`}

   LIVE SIMULATION (replace with server readings)
   ============================================================ */
function diurnal(h){return 1+.28*Math.sin((h-6)/24*2*Math.PI*2)+.18*Math.sin((h-8)/24*2*Math.PI)}
function stepNode(n){
  const h=new Date().getHours()+new Date().getMinutes()/60, f=diurnal(h);
  const rw=(v,base,sd,lo)=>Math.max(lo,v+(base*f-v)*.08+(Math.random()-.5)*sd);
  const b=hashN(n.id)%40;
  const bp=n.bp||(55+b);n.r.pm25=rw(n.r.pm25,bp,4,5);n.r.pm10=rw(n.r.pm10,bp*1.75,6,10);n.r.no2=rw(n.r.no2,35+b/2,2,2);
  n.r.co=Math.max(.2,rw(n.r.co,2+b/40,.15,.2));n.r.o3=rw(n.r.o3,40,2,2);n.r.co2=rw(n.r.co2,440+b*3,6,380);
  n.r.temp=rw(n.r.temp,30,.2,15);n.r.hum=Math.min(99,rw(n.r.hum,65,.8,20));n.r.wind=Math.max(.2,rw(n.r.wind,2.5,.3,.2));
  const a=aqiOf(n.r);n.hist.push({t:Date.now(),aqi:a.aqi,pm25:+n.r.pm25.toFixed(1),pm10:+n.r.pm10.toFixed(1),no2:+n.r.no2.toFixed(1)});
  if(n.hist.length>60)n.hist.shift();
  // vehicle count from CCTV (simulated) and traffic rule
  const t=n.traffic;t.count=Math.round(Math.max(5,(18+b/2)*f+(Math.random()-.5)*8));t.pcu=Math.round(t.count*1.35);t.ci=+(t.pcu/45).toFixed(2);
  const hi=a.aqi>S.settings.alertAqi&&t.ci>S.settings.ciLimit, lo=a.aqi<S.settings.alertAqi-10||t.ci<S.settings.ciLimit-.1;
  t.hiN=hi?(t.hiN||0)+1:0; t.loN=lo?(t.loN||0)+1:0;   // 2 cycles in a row before acting (no flapping)
  const want=t.red===S.settings.redShort?(t.loN>=2?S.settings.redNormal:S.settings.redShort):(t.hiN>=2?S.settings.redShort:S.settings.redNormal);
  if(t.auto&&want!==t.red){t.red=want;const txt=want===S.settings.redShort?`Red wait ${S.settings.redNormal} → ${S.settings.redShort} s (AQI ${a.aqi}, CI ${t.ci})`:`Back to normal ${S.settings.redNormal} s`;
    t.lastAction=txt;S.tlog.unshift({time:nowStr(),nodeId:n.id,action:txt,by:'Automatic'});S.tlog=S.tlog.slice(0,80);
    if(want===S.settings.redShort)S.alerts.unshift({time:nowStr(),to:'traffic',nodeId:n.id,text:`Alert light on at ${n.name}: clear the queue`});}
}
function autoAuthority(){
  for(const n of S.nodes){if(n.dustDays>=5&&!S.msgs.some(m=>m.nodeId===n.id&&m.type==='Water-spray machine')){
    S.msgs.unshift({id:uid('M'),time:nowStr(),type:'Water-spray machine',nodeId:n.id,to:'City Corporation',area:n.name,evidence:`Road dust on ${n.dustDays} of the last 7 days; PM10 high, PM2.5/PM10 below 0.5`,status:'draft'});}}
  for(const d of S.surveys){if(d.highDust&&!S.msgs.some(m=>m.surveyId===d.id)){S.msgs.unshift({id:uid('M'),time:nowStr(),type:'Enforcement drive',surveyId:d.id,to:'DoE / City Corporation',area:d.zone,evidence:`Drone survey ${d.id}: regular high AQI and dust. ${d.notes}`,status:'draft'});}}
}
function userAlertCheck(){
  if(!me||me.role!=='user')return;const loc=me.lat?[me.lat,me.lng]:(me.home&&nodeById(me.home)?[nodeById(me.home).lat,nodeById(me.home).lng]:null);if(!loc)return;
  const a=aqiAt(loc[0],loc[1]),lim=me.sensitive?S.settings.sensitiveAqi:S.settings.alertAqi;
  if(a>lim&&(!me.lastAlert||Date.now()-me.lastAlert>S.settings.cooldownMin*60000)){me.lastAlert=Date.now();
    const txt=`AQI ${a} in your area. ${advice(a).slice(0,3).join('. ')}.`;S.alerts.unshift({time:nowStr(),to:me.id,text:txt});toast(txt,'bad');saveState();}
}

function forecast(n,h=24){const last=n.hist.slice(-12).reduce((s,x)=>s+x.aqi,0)/Math.min(12,n.hist.length||1);const out=[];const hr=new Date().getHours();
  for(let i=1;i<=h;i++){const f=diurnal((hr+i)%24)/diurnal(hr);const v=Math.round(last*(.7+.3*f));out.push({h:(hr+i)%24,v,lo:Math.round(v-(5+i*.8)),hi:Math.round(v+(5+i*.8))})}return out}

/* ---------- Navigation with mask alerts ---------- */
/* ============================================================
   CLEAN-AIR NAVIGATION (Google-Maps-style, avoids high-AQI areas)
   Routing: OSRM (FOSSGIS / project-osrm) for road routes and turn-by-turn,
   Valhalla (FOSSGIS) for routes that exclude polluted zones.
   Search: Nominatim (OpenStreetMap).
   ============================================================ */
const OSRM={car:['https://routing.openstreetmap.de/routed-car/route/v1/driving/','https://router.project-osrm.org/route/v1/driving/'],
  bike:['https://routing.openstreetmap.de/routed-bike/route/v1/driving/'],foot:['https://routing.openstreetmap.de/routed-foot/route/v1/driving/']};
const VALHALLA='https://valhalla1.openstreetmap.de/route';
const COSTING={car:'auto',bike:'bicycle',foot:'pedestrian'};
let NV={from:null,to:null,routes:[],sel:0,zones:[],layers:[],drive:null,watch:null,lastMask:0};
async function fetchJSON(url,ms=12000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const DIRS=['north','north-east','east','south-east','south','south-west','west','north-west'];
function arrow(t,m){if(t==='arrive')return '⚑';if(t==='depart')return '●';if(t==='roundabout'||t==='rotary')return '⟳';return {left:'↰',right:'↱','sharp left':'↰','sharp right':'↱','slight left':'↖','slight right':'↗',uturn:'↶',straight:'↑'}[m]||'↑'}
function osrmText(s){const m=s.maneuver,t=m.type,mod=m.modifier||'',road=s.name?` onto ${s.name}`:'';
 if(t==='depart')return `Head ${DIRS[Math.round((m.bearing_after||0)/45)%8]}${s.name?` on ${s.name}`:''}`;
 if(t==='arrive')return 'Arrive at your destination';
 if(t==='roundabout'||t==='rotary')return `At the roundabout, take exit ${m.exit||1}${road}`;
 if(t==='merge')return `Merge${road}`;if(t==='on ramp')return `Take the ramp${road}`;if(t==='off ramp')return `Take the exit${road}`;
 if(t==='fork')return `Keep ${mod||'straight'} at the fork${road}`;if(t==='end of road')return `At the end of the road, turn ${mod}${road}`;
 if(t==='continue'||t==='new name')return `Continue${mod&&mod!=='straight'?' '+mod:''}${road}`;
 if(mod==='straight')return `Go straight${road}`;return `Turn ${mod}${road}`}
function decodePoly(str,p=6){let i=0,lat=0,lng=0,out=[],f=Math.pow(10,p);while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);out.push([lat/f,lng/f])}return out}
async function osrmRoute(mode,pts,alts){for(const base of OSRM[mode]){try{
  const j=await fetchJSON(`${base}${pts.map(p=>p[1].toFixed(6)+','+p[0].toFixed(6)).join(';')}?overview=full&geometries=geojson&steps=true&alternatives=${alts?'true':'false'}`);
  if(j.code!=='Ok'||!j.routes?.length)continue;
  return j.routes.map(r=>{const coords=r.geometry.coordinates.map(c=>[c[1],c[0]]);const steps=[];r.legs.forEach(l=>l.steps.forEach(s=>{if(s.maneuver.type==='arrive'&&steps.some(x=>x.type==='arrive'))return;steps.push({text:osrmText(s),dist:s.distance,type:s.maneuver.type,icon:arrow(s.maneuver.type,s.maneuver.modifier),loc:[s.maneuver.location[1],s.maneuver.location[0]]})}));
   const via=r.legs.map(l=>l.summary).filter(Boolean).join(', ');return {coords,dur:r.duration,dist:r.distance,steps,via,src:'OSRM'}})}catch(e){}}return null}
async function valhallaRoute(mode,a,b,polys){try{const q={locations:[{lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}],costing:COSTING[mode],exclude_polygons:polys,alternates:1,directions_options:{units:'kilometers',language:'en-US'}};
  const j=await fetchJSON(`${VALHALLA}?json=${encodeURIComponent(JSON.stringify(q))}`);const trips=[j.trip,...(j.alternates||[]).map(x=>x.trip)].filter(Boolean);
  return trips.map(t=>{const coords=[].concat(...t.legs.map(l=>decodePoly(l.shape)));const steps=[];t.legs.forEach(l=>l.maneuvers.forEach(m=>{const loc=coords[Math.min(m.begin_shape_index,coords.length-1)];steps.push({text:m.instruction,dist:m.length*1000,type:m.type===4||m.type===5||m.type===6?'arrive':'turn',icon:m.type===4||m.type===5||m.type===6?'⚑':(/left/i.test(m.instruction)?'↰':/right/i.test(m.instruction)?'↱':'↑'),loc})}));
   const names=[...new Set(t.legs[0].maneuvers.flatMap(m=>m.street_names||[]))].slice(0,2).join(', ');return {coords,dur:t.summary.time,dist:t.summary.length*1000,steps,via:names,src:'Valhalla'}})}catch(e){return null}}
function dronePoints(maxH=24){const lim=Date.now()-maxH*3600e3;return S.surveys.filter(s=>(s.ts||0)>=lim).flatMap(s=>(s.points||[]).map(p=>({...p,survey:s.id,zone:s.zone,time:s.time})))}
function circlePoly(z,n=12){const out=[];for(let i=0;i<=n;i++){const t=i/n*2*Math.PI;out.push([+(z.lng+(z.r/111320/Math.cos(z.lat*Math.PI/180))*Math.cos(t)).toFixed(6),+(z.lat+(z.r/110540)*Math.sin(t)).toFixed(6)])}return out}
function offsetPt(lat,lng,brg,m){const d=m/6371000,b=brg*Math.PI/180,p1=lat*Math.PI/180,l1=lng*Math.PI/180;const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return [p2*180/Math.PI,l2*180/Math.PI]}
function bearing(a,b){const t=x=>x*Math.PI/180;const y=Math.sin(t(b[1]-a[1]))*Math.cos(t(b[0])),x=Math.cos(t(a[0]))*Math.sin(t(b[0]))-Math.sin(t(a[0]))*Math.cos(t(b[0]))*Math.cos(t(b[1]-a[1]));return (Math.atan2(y,x)*180/Math.PI+360)%360}
function scoreRoute(rt){const p=rt.coords;let total=0;const d=[0];for(let i=1;i<p.length;i++){total+=hav(p[i-1][0],p[i-1][1],p[i][0],p[i][1])*1000;d.push(total)}
 rt.segs=[];let s=0;for(let i=1;i<p.length;i++){if(d[i]-d[s]>=150||i===p.length-1){const mid=p[Math.floor((s+i)/2)];rt.segs.push({from:s,to:i,a:aqiAt(mid[0],mid[1]),len:d[i]-d[s]});s=i}}
 total=total||1;rt.avg=Math.round(rt.segs.reduce((x,g)=>x+g.a*g.len,0)/total);rt.max=Math.max(...rt.segs.map(g=>g.a));rt.exp=Math.round(rt.segs.reduce((x,g)=>x+g.a*(rt.dur*g.len/total)/60,0));
 rt.bad=rt.segs.filter(g=>g.a>S.settings.alertAqi).reduce((x,g)=>x+g.len,0);
 rt.steps.forEach(st=>{let bi=0,bd=1e9;p.forEach((q,i)=>{const dd=Math.abs(q[0]-st.loc[0])+Math.abs(q[1]-st.loc[1]);if(dd<bd){bd=dd;bi=i}});st.idx=bi})}
function hazardNear(rt,z){let best=1e9,idx=0;rt.coords.forEach((q,i)=>{const dd=hav(q[0],q[1],z.lat,z.lng)*1000;if(dd<best){best=dd;idx=i}});return best<z.r?idx:-1}
function fmtD(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m/10)*10+' m'}
function fmtT(s){const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`}

function aqiZones(thr,a,b,buf){const z=[];S.nodes.forEach(n=>{const q=nodeAqi(n);if(q>thr)z.push({lat:n.lat,lng:n.lng,r:500,label:`${n.name}: AQI ${q}`})});

/* how much of a route runs inside (zone radius + safety buffer) */
function zoneHits(rt,zones,buf){const p=rt.coords;let len=0;const hit=new Map();
 for(let i=1;i<p.length;i++){const mid=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];
  for(const z of zones){if(hav(mid[0],mid[1],z.lat,z.lng)*1000<z.r+buf){len+=hav(p[i-1][0],p[i-1][1],p[i][0],p[i][1])*1000;if(!hit.has(z))hit.set(z,i);break}}}
 rt.hitLen=Math.round(len);rt.hitN=hit.size;rt.hitZones=[...hit.entries()].sort((x,y)=>x[1]-y[1]).map(e=>({z:e[0],i:e[1]}))}
function nearestIdx(rt,pt){let bi=0,bd=1e9;rt.coords.forEach((q,i)=>{const d=hav(q[0],q[1],pt[0],pt[1]);if(d<bd){bd=d;bi=i}});return bi}
function routeKey(r){return Math.round(r.dist/120)+'_'+Math.round(r.dur/45)}
/* Search for a road route that stays clear of every polluted zone.
   Step 1, corridor sweep: try detour points to either side of the straight line (1.5, 3 and 4.5 km out).
   Step 2, best-first repair: take the candidate that crosses the least, and add a detour point beside
   the first zone it still crosses; repeat until a clean route is found or the request budget runs out. */
async function avoidSearch(mode,a,b,zones,buf,cands){const keys=new Set(cands.map(routeKey));let budget=18;const clean=pt=>!zones.some(o=>hav(o.lat,o.lng,pt[0],pt[1])*1000<o.r+buf+150);

  if(keys.has(routeKey(nr)))return null;keys.add(routeKey(nr));cands.push(nr);return nr};
 const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],br=bearing(a,b),span=hav(a[0],a[1],b[0],b[1])*1000;

   let pt=offsetPt(mid[0],mid[1],(br+side+360)%360,d);if(!clean(pt))pt=offsetPt(mid[0],mid[1],(br+side+360)%360,d+700);if(!clean(pt))continue;
   const nr=await add([pt]);if(nr&&nr.hitN===0)return cands}}
 const expanded=new Set();
 while(budget>0){const open=cands.filter(r=>!expanded.has(r)&&r.hitN>0).sort((x,y)=>x.hitLen-y.hitLen||x.dur-y.dur);if(!open.length)break;const best=open[0];expanded.add(best);
  const first=best.hitZones[0];if(!first)continue;const z=first.z,i=first.i,c=best.coords,zbr=bearing(c[Math.max(0,i-4)],c[Math.min(c.length-1,i+4)]);

    const list=[...vias,{pt,idx:i}].sort((x,y)=>x.idx-y.idx).map(v=>v.pt);const nr=await add(list);if(nr&&nr.hitN===0)return cands}}}
 return cands}
async function findRoutes(){

function nvDraw(){const m=window._nvmap;NV.layers=NV.layers.filter(l=>{if(l._pin)return true;m.removeLayer(l);return false});

function nvStop(){if(NV.drive){clearInterval(NV.drive);NV.drive=null}if(NV.watch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(NV.watch);NV.watch=null}if(NV.me){window._nvmap.removeLayer(NV.me);NV.me=null}const l=document.getElementById('nv-live');if(l)l.style.display='none'}

 let bi=0,bd=1e9;r.coords.forEach((q,i)=>{const d=hav(q[0],q[1],p[0],p[1]);if(d<bd){bd=d;bi=i}});const next=r.steps.find(s=>s.idx>bi)||r.steps[r.steps.length-1];const dist=next?hav(p[0],p[1],next.loc[0],next.loc[1])*1000:0;

 window._dsPts=[];const dm=mkMap('dsmap',[23.78,90.40],12);nodeMarkers(dm,null,{noLegend:true});dm.on('click',e=>{const label=prompt('What did the drone find here?','High PM10')||'High reading';window._dsPts.push({lat:+e.latlng.lat.toFixed(5),lng:+e.latlng.lng.toFixed(5),label});
  L.circle(e.latlng,{radius:260,color:'#D64541',fillOpacity:.28}).addTo(dm);document.getElementById('ds-hs').value=window._dsPts.length;document.getElementById('ds-pts').textContent=window._dsPts.map((p,i)=>`${i+1}. ${p.label}`).join('   ')})};

 <td class="pwd">${u.id}<br><span id="pw-${u.id}">••••••</span> <button class="btn l s" onclick="togglePw('${u.id}',this)">Show</button></td>
 <td><select class="in" style="padding:5px 8px;min-width:150px" onchange="setRole('${u.id}',this.value)" ${u.id===me.id?'disabled':''}>${['admin','coordinator','traffic','user'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${roleName(r)}</option>`).join('')}</select></td>
 <td class="small">${u.role==='coordinator'||u.role==='traffic'?`${u.nodes.map(x=>esc(nodeById(x)?.name||x)).join(', ')||'<span class="muted">None</span>'}<br><button class="btn l s" onclick="nodePick('${u.id}')"><i class="fa-solid fa-pen"></i>Change</button>`:'<span class="muted">—</span>'}</td>
 <td>${stTag(u.status)}</td><td>${u.id!==me.id?`<button class="btn r s" onclick="delUser('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div></div></div>`)};
function approve(id){const u=userById(id);u.status='active';saveState();toast(`${u.name} approved`);if(u.role==='coordinator'&&!u.nodes.length)nodePick(id);else go('members')}
function reject(id){userById(id).status='rejected';saveState();toast('Rejected');go('members')}
function togglePw(id,b){const e=document.getElementById('pw-'+id);const show=e.textContent.startsWith('•');e.textContent=show?userById(id).pass:'••••••';if(b)b.textContent=show?'Hide':'Show'}
function setRole(id,r){userById(id).role=r;saveState();toast('Role changed');go('members')}
function delUser(id){if(!confirm('Delete this member?'))return;S.users=S.users.filter(u=>u.id!==id);saveState();go('members')}
function nodePick(id){const u=userById(id);openModal(`<h3>Nodes for ${esc(u.name)}</h3><p class="muted">This ${roleName(u.role).toLowerCase()} is responsible for the nodes you tick.</p><div class="chk">${S.nodes.map(n=>`<label><input type="checkbox" class="np" value="${n.id}" ${u.nodes.includes(n.id)?'checked':''}>${esc(n.name)} (${n.zone})</label>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="saveNodePick('${id}')">Save</button><button class="btn l" onclick="closeModal();go('members')">Cancel</button></div>`)}
function saveNodePick(id){userById(id).nodes=[...document.querySelectorAll('.np:checked')].map(x=>x.value);saveState();closeModal();toast('Nodes assigned');go('members')}
function addMember(){const g=id=>document.getElementById(id).value.trim();const name=g('mm-name'),phone=g('mm-phone'),pass=g('mm-pass');if(!name||!phone||!pass){toast('Name, phone and password are required.','bad');return}if(S.users.some(u=>u.phone===phone)){toast('This phone number already has an account.','bad');return}
 S.users.push({id:uid('U'),name,phone,email:g('mm-email'),pass,role:g('mm-role'),status:'active',nodes:[...document.querySelectorAll('.mm-n:checked')].map(x=>x.value),home:S.nodes[0].id,created:nowStr()});saveState();toast(`${name} added`);go('members')}

/* ---------- Incident message box ---------- */
R.incidents=()=>{V_(`<div class="card"><h3>Repair and emergency reports</h3>${S.tickets.length?`<div class="twrap"><table class="tbl"><tr><th>Time</th><th>Node</th><th>Type</th><th>Details</th><th>From</th><th>Status</th><th></th></tr>
 ${S.tickets.map(t=>`<tr><td class="small">${t.time}</td><td><b>${t.nodeId}</b><br><span class="small muted">${esc(nodeById(t.nodeId)?.name||'')}</span></td><td>${t.type==='Emergency'?'<span class="tag t-bad">Emergency</span>':'<span class="tag t-warn">Repair</span>'}</td><td>${esc(t.details)}</td><td class="small">${esc(t.by||'Public')}</td><td>${t.status==='open'?'<span class="tag t-bad">Open</span>':'<span class="tag t-ok">Solved</span>'}</td><td>${t.status==='open'?`<button class="btn s" onclick="solve('${t.id}')">Mark solved</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">No reports.</div>'}</div>`)};

/* ---------- Traffic control (CCTV counting + automatic signal) ---------- */
R.traffic=()=>{V_(`<div class="banner info"><i class="fa-solid fa-circle-info"></i><div>CCTV video reaches this admin office only when a node's area AQI is high. AI counts vehicles; when AQI is over ${S.settings.alertAqi} and the queue index is over ${S.settings.ciLimit}, the node cuts the red wait from ${S.settings.redNormal} to ${S.settings.redShort} s and messages the traffic in-charge. You can take over any junction.</div></div>
 <div class="grid g2" id="tgrid">${S.nodes.map(n=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(n.name)}</h3><span id="ts-${n.id}"></span></div>
 <div class="cctv" style="margin-top:10px">${n.videoUrl?`<video src="${esc(n.videoUrl)}" autoplay muted loop style="width:100%;display:block"></video>`:`<canvas id="cv-${n.id}" width="560" height="220"></canvas>`}<span class="lbl">CCTV · ${n.id}</span><span class="rec">● AI counting</span></div>
 <div class="grid g4" style="margin-top:10px" id="tk-${n.id}"></div>
 <div class="row" style="margin-top:10px;justify-content:space-between"><div class="sig" id="sg-${n.id}"></div><div class="row"><label class="small"><input type="checkbox" ${n.traffic.auto?'checked':''} onchange="setAuto('${n.id}',this.checked)"> Automatic</label><button class="btn o s" onclick="override('${n.id}')">Reset to ${S.settings.redNormal} s</button></div></div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>Action log</h3><div id="tlog"></div></div>`);
 S.nodes.forEach(n=>{if(!n.videoUrl)cctvSim(n)});updTraffic()};
function updTraffic(){S.nodes.forEach(n=>{const t=n.traffic,a=nodeAqi(n);const k=document.getElementById('tk-'+n.id);if(!k)return;
 k.innerHTML=[['Vehicles',t.count],['PCU',t.pcu],['Queue index',t.ci],['AQI',a]].map(([x,y])=>`<div class="kpi" style="padding:8px 10px"><small>${x}</small><b style="font-size:22px">${y}</b></div>`).join('');
 document.getElementById('sg-'+n.id).innerHTML=`<span class="lamp red"></span><b>Red wait ${t.red} s</b>${t.red===S.settings.redShort?'<span class="lamp on"></span><span class="small">Alert light on</span>':''}`;
 document.getElementById('ts-'+n.id).innerHTML=t.red===S.settings.redShort?'<span class="tag t-bad">Action on</span>':'<span class="tag t-ok">Normal</span>'});
 const l=document.getElementById('tlog');if(l)l.innerHTML=S.tlog.length?`<div class="twrap"><table class="tbl"><tr><th>Time</th><th>Node</th><th>Action</th><th>By</th></tr>${S.tlog.slice(0,25).map(x=>`<tr><td class="small">${x.time}</td><td>${esc(nodeById(x.nodeId)?.name||x.nodeId)}</td><td>${esc(x.action)}</td><td class="small">${x.by}</td></tr>`).join('')}</table></div>`:'<div class="empty">No actions yet.</div>'}
function setAuto(id,v){nodeById(id).traffic.auto=v;saveState();toast(v?'Automatic control on':'Automatic control off for this junction')}
function override(id){const n=nodeById(id);n.traffic.red=S.settings.redNormal;n.traffic.auto=false;S.tlog.unshift({time:nowStr(),nodeId:id,action:`Admin override: red wait ${S.settings.redNormal} s, automatic off`,by:me.name});saveState();go('traffic')}
function cctvSim(n){const cv=document.getElementById('cv-'+n.id);if(!cv)return;const x=cv.getContext('2d');const W=cv.width,H=cv.height;const types=[['Car','#4FA3E0',38,18],['Bus','#E08A1E',70,24],['CNG','#1E9E6A',26,16],['Bike','#C9A20C',18,10],['Rickshaw','#8A5CC2',24,14]];
 let cars=[],passed=0;const a={id:0};anims.push(a);
 function spawn(){const t=types[Math.floor(Math.random()*types.length)];const lane=Math.floor(Math.random()*3);cars.push({t,x:-t[2],y:60+lane*50,v:1+Math.random()*1.6*(n.traffic.red===S.settings.redShort?1.3:1),counted:false})}
 function f(){x.fillStyle='#26332F';x.fillRect(0,0,W,H);x.fillStyle='#3A4744';x.fillRect(0,40,W,150);x.strokeStyle='#8A9B95';x.setLineDash([14,12]);for(let i=0;i<2;i++){x.beginPath();x.moveTo(0,90+i*50);x.lineTo(W,90+i*50);x.stroke()}x.setLineDash([]);
  x.strokeStyle='#F2C94C';x.lineWidth=2;x.beginPath();x.moveTo(W*.62,40);x.lineTo(W*.62,190);x.stroke();x.lineWidth=1;
  if(Math.random()<.04*(n.traffic.count/20))spawn();
  cars.forEach(c=>{c.x+=c.v;const [nm,col,w,h]=c.t;x.fillStyle=col;x.fillRect(c.x,c.y-h/2,w,h);x.strokeStyle='#7CFCB0';x.strokeRect(c.x-3,c.y-h/2-3,w+6,h+6);x.fillStyle='#7CFCB0';x.font='10px Barlow';x.fillText(nm,c.x-2,c.y-h/2-6);if(!c.counted&&c.x>W*.62){c.counted=true;passed++}});
  cars=cars.filter(c=>c.x<W+80);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(W-150,H-30,142,22);x.fillStyle='#fff';x.font='13px Barlow';x.fillText(`Counted: ${passed}`,W-142,H-14);a.id=requestAnimationFrame(f)}
 f()}

/* ---------- ESP32-CAM checks ---------- */
R.camcheck=()=>{V_(`<div class="banner warn"><i class="fa-solid fa-flask"></i><div><b>Future feature, planned with BRTA.</b> ESP32-CAM photos are checked on the server for black smoke; only confirmed vehicles are kept, faces are blurred, and every case needs a person to verify it.</div></div>
 <div class="grid g3">${S.cam.map(c=>`<div class="card"><div class="cctv" style="height:150px;display:flex;align-items:center;justify-content:center;color:#8FB8AC"><i class="fa-solid fa-truck" style="font-size:54px"></i><span class="lbl">${c.nodeId}</span><span class="rec">Smoke ${(c.score*100).toFixed(0)}%</span></div>
 <p style="margin:10px 0 4px"><b>Plate read:</b> ${esc(c.plate)}</p><p class="small muted">${c.time} · ${esc(nodeById(c.nodeId)?.name||'')}</p>
 <div class="row">${c.status==='pending'?`<button class="btn s" onclick="camSet('${c.id}','verified')">Verify case</button><button class="btn r s" onclick="camSet('${c.id}','rejected')">Reject</button>`:stTag(c.status)}</div></div>`).join('')||'<div class="empty">No cases.</div>'}</div>`)};
function camSet(id,s){S.cam.find(c=>c.id===id).status=s;saveState();toast(s==='verified'?'Case verified; it will go to BRTA once the collaboration starts':'Case rejected and deleted from evidence');go('camcheck')}

/* ---------- Citizen report verification ---------- */
R.verify=()=>{V_(`<div class="grid g3"><div class="card span2"><h3>Reports</h3>${S.reports.length?`<div class="twrap"><table class="tbl"><tr><th>Report</th><th>From</th><th>Nearby AQI</th><th>File</th><th></th></tr>
 ${S.reports.map(r=>`<tr><td><b>${esc(r.type)}</b><br><span class="small">${esc(r.note||'')}</span><br><span class="small muted">${r.time} · ${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</span></td><td class="small">${esc(userById(r.userId)?.name||'User')}</td><td>${aqiBadge(aqiAt(r.lat,r.lng))}</td><td class="small">${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.file)}</a>`:esc(r.file||'—')}</td>
 <td style="white-space:nowrap">${r.status==='pending'?`<button class="btn s" onclick="verRep('${r.id}','approved')">Verify</button> <button class="btn r s" onclick="verRep('${r.id}','rejected')">Reject</button>`:stTag(r.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No reports yet.</div>'}</div>
 <div class="card"><h3>On the map</h3><div id="vmap" class="map"></div><p class="note">Verified reports become hotspots on every map and count in the reports.</p></div></div>`);
 const m=mkMap('vmap',[23.78,90.40],12);nodeMarkers(m);S.reports.forEach(r=>L.circleMarker([r.lat,r.lng],{radius:8,color:'#fff',weight:2,fillColor:r.status==='approved'?'#D64541':r.status==='pending'?'#E08A1E':'#8A9B95',fillOpacity:1}).addTo(m).bindTooltip(esc(r.type)))};
function verRep(id,s){const r=S.reports.find(x=>x.id===id);r.status=s;if(s==='approved'){let best=S.nodes[0],bd=1e9;S.nodes.forEach(n=>{const d=hav(r.lat,r.lng,n.lat,n.lng);if(d<bd){bd=d;best=n}});best.hotspots.push({lat:r.lat,lng:r.lng,label:`Citizen report: ${r.type}`,type:r.type})}saveState();toast(s==='approved'?'Verified and added as a hotspot':'Report rejected; the sender is told');go('verify')}

/* ---------- Survey requests and drone surveys ---------- */
R.surveys=()=>{const co=S.users.filter(u=>u.role==='coordinator'&&u.status==='active');
 V_(`<div class="card" style="margin-bottom:16px"><h3>Hotspot survey requests from users</h3>${S.requests.length?`<div class="twrap"><table class="tbl"><tr><th>Area</th><th>Reason</th><th>From</th><th>Status</th><th>Assign to coordinator</th></tr>
 ${S.requests.map(r=>`<tr><td><b>${esc(r.area)}</b><br><span class="small muted">${r.time}</span></td><td>${esc(r.reason)}</td><td class="small">${esc(userById(r.userId)?.name||'User')}</td><td>${stTag(r.status)}</td>
 <td><select class="in" style="padding:5px 8px" onchange="assignReq('${r.id}',this.value)"><option value="">Choose…</option>${co.map(c=>`<option value="${c.id}" ${r.coordId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<div class="empty">No requests.</div>'}</div>
 <div class="card"><h3>Drone surveys uploaded by coordinators</h3>${S.surveys.length?`<div class="twrap"><table class="tbl"><tr><th>Time</th><th>Zone</th><th>Coordinator</th><th>Hotspots</th><th>Notes</th><th>Video</th></tr>${S.surveys.map(s=>`<tr><td class="small">${s.time}</td><td>${s.zone}</td><td class="small">${esc(userById(s.coordId)?.name||'')}</td><td>${s.hotspots}${s.highDust?' <span class="tag t-warn">Regular dust</span>':''}</td><td class="small">${esc(s.notes)}</td><td class="small">${s.videoUrl?`<a href="${s.videoUrl}" target="_blank" rel="noopener">${esc(s.video)}</a>`:esc(s.video||'—')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No surveys yet.</div>'}</div>`)};
function assignReq(id,c){const r=S.requests.find(x=>x.id===id);r.coordId=c;r.status=c?'assigned':'open';saveState();toast(c?'Assigned':'Unassigned');renderSide()}

/* ---------- Authority messages ---------- */
R.authority=()=>{V_(`<div class="banner info"><i class="fa-solid fa-robot"></i><div>The system drafts a message when a spot has regular dust (node and drone data, 5 of 7 days) or when a drone survey finds regular high AQI and dust. Review and send.</div></div>
 <div class="grid g2">${S.msgs.map(m=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(m.type)}</h3>${stTag(m.status)}</div><p class="small muted" style="margin:4px 0 8px">To ${esc(m.to)} · ${m.time}</p><p><b>Area:</b> ${esc(m.area)}</p><p class="small">${esc(m.evidence)}</p>
 <p class="small"><b>Suggested action:</b> ${m.type==='Water-spray machine'?'Install a lamp-post mist spray on the city water line at this spot.':'Run an enforcement drive against uncovered construction material and open burning in this area.'}</p>
 ${m.status==='draft'?`<button class="btn s" onclick="sendMsg('${m.id}')"><i class="fa-solid fa-paper-plane"></i>Send to ${esc(m.to)}</button>`:''}</div>`).join('')||'<div class="empty">No messages yet.</div>'}</div>`)};
function sendMsg(id){S.msgs.find(m=>m.id===id).status='sent';saveState();toast('Message sent');go('authority')}

/* ---------- Forecast and reports ---------- */
R.plan=({s1=40,s2=25,s3=20,r1=15,r2=30,r3=10})=>{const base=S.nodes.reduce((s,n)=>s+n.r.pm25,0)/S.nodes.length;
 const yrs=[0,1,2,3].map(y=>{const k=y/3;const red=(s1/100)*(r1/100)*k+(s2/100)*(r2/100)*k+(s3/100)*(r3/100)*k;const pm=base*(1-red);return {y,pm:pm.toFixed(1),aqi:sub('pm25',pm)}});
 V_(`<div class="grid g2"><div class="card"><h3>City forecast, next 24 hours</h3><div class="chartbox"><canvas id="plfc"></canvas></div></div>
 <div class="card"><h3>1, 2 and 3 year plan <span class="hint">PM2.5 after planned actions</span></h3><p class="small muted">Source share × planned reduction, reached step by step over 3 years.</p>
 ${[['Traffic share','s1',s1],['Road dust share','s2',s2],['Burning share','s3',s3],['Traffic reduction','r1',r1],['Dust reduction','r2',r2],['Burning reduction','r3',r3]].map(([l,k,v])=>`<div class="row" style="margin:4px 0"><span style="width:150px" class="small">${l}</span><input type="range" min="0" max="80" value="${v}" style="flex:1" onchange="go('plan',Object.assign({},cur.p,{${k}:+this.value}))"><b style="width:44px">${v}%</b></div>`).join('')}
 <table class="tbl" style="margin-top:8px"><tr><th></th>${yrs.map(y=>`<th>${y.y?'Year '+y.y:'Now'}</th>`).join('')}</tr><tr><td>PM2.5 (µg/m³)</td>${yrs.map(y=>`<td>${y.pm}</td>`).join('')}</tr><tr><td>AQI</td>${yrs.map(y=>`<td>${aqiBadge(y.aqi)}</td>`).join('')}</tr></table></div></div>
 <div class="card" style="margin-top:16px"><h3>Exports</h3><div class="row"><button class="btn" onclick="exportCity()"><i class="fa-solid fa-file-csv"></i>City readings (CSV)</button><button class="btn o" onclick="exportMonthly()"><i class="fa-solid fa-file-lines"></i>Monthly report (CSV)</button></div><p class="note">The government report combines these with DoE comparison and the 1–3 year plan above.</p></div>`);cityForecastChart('plfc')};
function exportCity(){csvDownload('city_readings.csv',[['node','name','zone','pm25','pm10','no2','co','o3','aqi'],...S.nodes.map(n=>[n.id,n.name,n.zone,n.r.pm25.toFixed(1),n.r.pm10.toFixed(1),n.r.no2.toFixed(1),n.r.co.toFixed(2),n.r.o3.toFixed(1),nodeAqi(n)])])}
function exportMonthly(){csvDownload('monthly_report.csv',[['item','value'],['City AQI now',cityAqi()],['Nodes',S.nodes.length],['Verified hotspots',S.nodes.reduce((s,n)=>s+n.hotspots.length,0)],['Signal actions',S.tlog.length],['Citizen reports verified',S.reports.filter(r=>r.status==='approved').length],['Authority messages sent',S.msgs.filter(m=>m.status==='sent').length],['Drone surveys',S.surveys.length]])}

/* ---------- Settings ---------- */
R.settings=()=>{const s=S.settings;V_(`<div class="grid g2"><div class="card"><h3>Thresholds</h3>
 ${[['alertAqi','Public alert above AQI'],['sensitiveAqi','Sensitive-group alert above AQI'],['cooldownMin','Minutes between alerts to the same user'],['redNormal','Normal red wait (s)'],['redShort','Shortened red wait (s)'],['ciLimit','Queue index limit']].map(([k,l])=>`<label class="f">${l}</label><input class="in" id="st-${k}" type="number" step="any" value="${s[k]}">`).join('')}
 <button class="btn" style="margin-top:12px" onclick="saveSettings()">Save settings</button></div>
 <div class="card"><h3>Demo data</h3><p class="muted">Everything is stored in this browser. Resetting brings back the starting nodes and accounts.</p><button class="btn r" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_me');location.reload()}">Reset demo data</button></div></div>`)};
function saveSettings(){for(const k in S.settings){const v=parseFloat(document.getElementById('st-'+k).value);if(!isNaN(v))S.settings[k]=v}saveState();toast('Settings saved')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
go(home());
</script>
</body>
</html>
